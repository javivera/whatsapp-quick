[package]
name = "whatsapp_quick"
version = "0.1.22"
description = "Floating keyboard-first WhatsApp palette"
authors = ["Javi Vera"]
edition = "2021"

[lib]
name = "whatsapp_quick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tauri = { version = "2", features = ["devtools", "macos-private-api", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSScreen", "NSEvent", "NSWorkspace", "NSRunningApplication", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSValue", "NSNotification", "NSObject", "NSOperation", "block2"] }
block2 = "0.6"
